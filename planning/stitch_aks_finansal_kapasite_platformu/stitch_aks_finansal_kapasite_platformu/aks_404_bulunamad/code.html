<style>
        body {
            background-color: #131317; /* surface-dim */
            color: #e5e1e7; /* on-surface */
            overflow: hidden; /* Prevent scrolling on 404 */
        }
        
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: rgba(195, 192, 255, 0.1);
            opacity: 0.4;
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .glitch-text {
            position: relative;
            display: inline-block;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .glitch-text::before {
            left: 2px;
            text-shadow: -2px 0 #c3c0ff;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -2px;
            text-shadow: -2px 0 #45dfa4;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(61px, 9999px, 52px, 0); }
            5% { clip: rect(33px, 9999px, 14px, 0); }
            10% { clip: rect(96px, 9999px, 50px, 0); }
            15% { clip: rect(42px, 9999px, 60px, 0); }
            20% { clip: rect(62px, 9999px, 86px, 0); }
            25% { clip: rect(2px, 9999px, 80px, 0); }
            30% { clip: rect(27px, 9999px, 7px, 0); }
            35% { clip: rect(98px, 9999px, 55px, 0); }
            40% { clip: rect(11px, 9999px, 84px, 0); }
            45% { clip: rect(59px, 9999px, 43px, 0); }
            50% { clip: rect(41px, 9999px, 32px, 0); }
            55% { clip: rect(18px, 9999px, 2px, 0); }
            60% { clip: rect(9px, 9999px, 77px, 0); }
            65% { clip: rect(44px, 9999px, 22px, 0); }
            70% { clip: rect(79px, 9999px, 31px, 0); }
            75% { clip: rect(13px, 9999px, 20px, 0); }
            80% { clip: rect(66px, 9999px, 92px, 0); }
            85% { clip: rect(74px, 9999px, 59px, 0); }
            90% { clip: rect(91px, 9999px, 4px, 0); }
            95% { clip: rect(23px, 9999px, 19px, 0); }
            100% { clip: rect(82px, 9999px, 73px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(65px, 9999px, 100px, 0); }
            5% { clip: rect(52px, 9999px, 74px, 0); }
            10% { clip: rect(79px, 9999px, 85px, 0); }
            15% { clip: rect(75px, 9999px, 5px, 0); }
            20% { clip: rect(67px, 9999px, 61px, 0); }
            25% { clip: rect(14px, 9999px, 79px, 0); }
            30% { clip: rect(1px, 9999px, 66px, 0); }
            35% { clip: rect(86px, 9999px, 30px, 0); }
            40% { clip: rect(23px, 9999px, 98px, 0); }
            45% { clip: rect(85px, 9999px, 72px, 0); }
            50% { clip: rect(71px, 9999px, 75px, 0); }
            55% { clip: rect(2px, 9999px, 48px, 0); }

            95% { clip: rect(42px, 9999px, 97px, 0); }

        }
