<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kurum Giriş - B2B Staff Portal</title>
<!-- Fonts & Icons -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#131317",
                        "surface-variant": "#353438",
                        "secondary": "#45dfa4",
                        "on-tertiary": "#670211",
                        "on-error": "#690005",
                        "tertiary-fixed-dim": "#ffb3b0",
                        "surface-tint": "#c3c0ff",
                        "on-tertiary-fixed-variant": "#881d24",
                        "on-primary": "#2c2a5e",
                        "primary-container": "#c3c0ff",
                        "on-secondary-fixed-variant": "#005137",
                        "on-secondary": "#003825",
                        "surface-bright": "#3a393d",
                        "inverse-on-surface": "#313034",
                        "primary": "#e2dfff",
                        "on-surface": "#e5e1e7",
                        "surface-container-highest": "#353438",
                        "inverse-primary": "#5a5890",
                        "on-tertiary-fixed": "#410006",
                        "on-background": "#e5e1e7",
                        "tertiary-fixed": "#ffdad8",
                        "surface-container-low": "#1c1b1f",
                        "surface-container-high": "#2a292d",
                        "secondary-fixed": "#68fcbf",
                        "on-surface-variant": "#c8c5d0",
                        "on-primary-container": "#4e4c83",
                        "on-secondary-fixed": "#002114",
                        "inverse-surface": "#e5e1e7",
                        "on-secondary-container": "#00452e",
                        "surface": "#131317",
                        "error-container": "#93000a",
                        "tertiary": "#ffdad8",
                        "on-primary-fixed-variant": "#434176",
                        "secondary-fixed-dim": "#45dfa4",
                        "surface-container-lowest": "#0e0e11",
                        "primary-fixed-dim": "#c3c0ff",
                        "outline": "#928f9a",
                        "background": "#131317",
                        "secondary-container": "#00bd85",
                        "on-tertiary-container": "#982a2f",
                        "on-error-container": "#ffdad6",
                        "surface-container": "#201f23",
                        "error": "#ffb4ab",
                        "tertiary-container": "#ffb3b0",
                        "primary-fixed": "#e3dfff",
                        "outline-variant": "#47464f",
                        "on-primary-fixed": "#161349"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "grid-margin": "24px",
                        "stack-default": "12px",
                        "gutter": "16px",
                        "stack-compact": "4px",
                        "container-padding": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Geist"],
                        "mono-label-sm": ["JetBrains Mono"],
                        "headline-md": ["Geist"],
                        "headline-lg": ["Geist"],
                        "mono-score-lg": ["JetBrains Mono"],
                        "mono-data-md": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "mono-label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "mono-score-lg": ["40px", { "lineHeight": "40px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "mono-data-md": ["14px", { "lineHeight": "18px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-container-padding font-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<main class="w-full max-w-md flex flex-col gap-stack-default relative z-10">
<!-- Login Card Level 1 Elevation -->
<div class="bg-[#0f172a] border border-outline-variant p-grid-margin rounded flex flex-col gap-[24px]">
<!-- Branding Header -->
<div class="flex flex-col items-center justify-center gap-stack-compact text-center">
<div class="w-12 h-12 bg-surface-container-high border border-outline-variant rounded-full flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="account_balance">account_balance</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">Kurum Girişi</h1>
<p class="font-mono-label-sm text-mono-label-sm text-on-surface-variant uppercase">B2B Staff Portal</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-gutter mt-4">
<!-- Email Input -->
<div class="flex flex-col gap-stack-compact relative group">
<label class="font-mono-label-sm text-mono-label-sm text-on-surface-variant" for="email">Kurumsal E-posta</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]" data-icon="mail">mail</span>
<input class="w-full bg-surface-dim border border-outline-variant text-on-surface font-mono-data-md text-mono-data-md pl-10 pr-3 py-2 rounded focus:ring-0 focus:border-primary transition-colors placeholder:text-outline-variant/50" id="email" placeholder="isim.soyisim@banka.com.tr" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-compact relative group">
<label class="font-mono-label-sm text-mono-label-sm text-on-surface-variant" for="password">Parola</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]" data-icon="lock">lock</span>
<input class="w-full bg-surface-dim border border-outline-variant text-on-surface font-mono-data-md text-mono-data-md pl-10 pr-3 py-2 rounded focus:ring-0 focus:border-primary transition-colors placeholder:text-outline-variant/50" id="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Caveat / Info -->
<div class="border border-amber-500/50 bg-amber-500/10 p-3 mt-2 rounded flex items-start gap-2">
<span class="material-symbols-outlined text-amber-500 text-[16px] mt-0.5 shrink-0" data-icon="info">info</span>
<p class="font-mono-label-sm text-mono-label-sm text-amber-500/90 leading-relaxed">
                        Yetkisiz erişim denemeleri kaydedilmektedir.
                    </p>
</div>
<!-- Submit Action -->
<button class="w-full bg-primary-container text-on-primary-container hover:bg-primary-fixed font-mono-label-sm text-mono-label-sm font-bold py-3 mt-2 rounded transition-colors duration-200 border border-primary-container flex justify-center items-center gap-2" type="submit">
<span>Giriş Yap</span>
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Compliance Footer -->
<div class="text-center px-4">
<p class="font-mono-label-sm text-mono-label-sm text-on-surface-variant/70 text-center inline-flex items-center gap-1.5 flex-wrap justify-center">
<span class="material-symbols-outlined text-[14px]" data-icon="gavel">gavel</span>
                Banka personeli oturumu — müşteri verisine yalnızca rızalı erişimle ulaşılır.
            </p>
</div>
</main>
<!-- Subtle Background Elements for depth (Technical Brutalism minimal flair) -->
<div class="fixed inset-0 pointer-events-none z-0 flex items-center justify-center opacity-[0.03]">
<div class="w-[800px] h-[800px] border border-outline rounded-full"></div>
<div class="w-[600px] h-[600px] border border-outline rounded-full absolute"></div>
<div class="w-[400px] h-[400px] border border-outline rounded-full absolute"></div>
</div>
</body></html>
